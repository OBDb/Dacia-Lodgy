generations:
  - name: "First Generation"
    start_year: 2012
    end_year: 2016
    description: "The Dacia Lodgy is a compact multi-purpose vehicle (MPV) produced by the French manufacturer Renault and its Romanian subsidiary Dacia since 2012. Built on the Nissan B platform (Dacia M0 platform), it featured a boxy, utilitarian design that prioritized interior space and functionality. Available in five or seven-seat configurations, the early generation offered a choice of four-cylinder engines: 1.2L turbocharged petrol Energy TCe 115, 1.6L naturally aspirated petrol, and a 1.5L turbocharged diesel dCi. The interior was basic but functional, with features including speed limiters, navigation systems with seven-inch touchscreen displays, Bluetooth and USB connectivity. A Stepway variant added SUV-inspired styling elements including increased ride height, roof rails, and plastic body cladding. The vehicle successfully filled a market gap for affordable family transportation."

  - name: "First Generation (2017 Facelift)"
    start_year: 2017
    end_year: 2022
    description: "The Dacia Lodgy received a facelift in 2017, which included subtle updates to the exterior and interior. The facelifted model introduced additional engine options including a 1.3L turbocharged petrol H5Ht engine alongside the existing powerplants. The facelift period saw continued evolution of technology features and design refinement while maintaining the same M0 platform. Production continued until 2022, when the model was succeeded by the Dacia Jogger, which combines MPV practicality with crossover styling elements. The Lodgy was also sold in India (2015-2020) as the Renault Lodgy under Renault branding in CIS countries, Ukraine, and India."
